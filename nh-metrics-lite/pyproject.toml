[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:BuildBackend"

[project]
name = "nh-metrics-lite"
version = "0.1.0"
description = "Lightweight utility functions adapted from neuralhydrology"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "xarray",
    "numpy",
    "scipy",
]